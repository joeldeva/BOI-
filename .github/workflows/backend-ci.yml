name: Backend CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev,analysis,production]"
      - name: Lint with ruff
        run: python -m ruff check fraudshield tests
      - name: Run automated test suite
        run: python -m pytest tests -ra
      - name: Build wheel and sdist package
        run: python -m build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fraudshield-backend-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  container-and-chart:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: "v3.16.4"
      - name: Validate Compose model
        run: docker compose config --quiet
      - name: Build backend container
        run: docker build --tag fraudshield:${{ github.sha }} .
      - name: Lint Helm chart (default)
        run: helm lint deploy/helm/fraudshield
      - name: Lint Helm chart (production example)
        run: helm lint deploy/helm/fraudshield --values deploy/helm/fraudshield/values-production.example.yaml
