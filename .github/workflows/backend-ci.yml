name: Backend CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libffi-dev libssl-dev pkg-config
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev,analysis,production]"
          python -m pip install pip-audit cyclonedx-bom
      - name: Lint with ruff
        run: python -m ruff check fraudshield tests
      - name: Run automated test suite
        run: python -m pytest tests -ra
      - name: Python SCA dependency audit (pip-audit)
        run: |
          pip-audit --skip-editable --desc on --format json -o backend-audit.json
          pip-audit --skip-editable --desc on
      - name: Build wheel and sdist package
        run: python -m build
      - name: Generate Backend CycloneDX SBOM
        run: |
          python -m cyclonedx_py environment --output-file dist/fraudshield-backend-sbom.cdx.json
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fraudshield-backend-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 30
      - name: Upload Backend SBOM
        uses: actions/upload-artifact@v4
        with:
          name: fraudshield-backend-sbom
          path: dist/fraudshield-backend-sbom.cdx.json
          if-no-files-found: error
          retention-days: 30
      - name: Attest Backend Artifact Provenance
        continue-on-error: true
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*"

  container-and-chart:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v5
        with:
          version: "v3.16.4"
      - name: Validate Compose model
        run: docker compose config --quiet
      - name: Build backend container
        run: docker build --tag fraudshield:${{ github.sha }} .
      - name: Scan backend container image (Trivy)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image --exit-code 1 --severity CRITICAL,HIGH --ignore-unfixed fraudshield:${{ github.sha }}
      - name: Lint Helm chart (default)
        run: helm lint deploy/helm/fraudshield
      - name: Lint Helm chart (production example)
        run: helm lint deploy/helm/fraudshield --values deploy/helm/fraudshield/values-production.example.yaml
