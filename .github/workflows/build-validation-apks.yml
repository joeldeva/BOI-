name: Build TRINETRA validation APKs
on:
  push:
    branches: [trinetra-validation-apks]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK packages
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" >/dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build both controlled APKs
        run: gradle :validation:assembleDebug :variant:assembleDebug --no-daemon
      - name: Prepare named demo APKs
        run: |
          mkdir -p dist
          cp validation/build/outputs/apk/debug/validation-debug.apk dist/03_TRINETRA_Validation.apk
          cp variant/build/outputs/apk/debug/variant-debug.apk dist/04_TRINETRA_Variant.apk
          sha256sum dist/*.apk | tee dist/SHA256SUMS.txt
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TRINETRA-Demo-APKs
          path: dist/
          if-no-files-found: error
          retention-days: 7
