name: Frontend CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-lint-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@1e60f620b9541d6ca1512c9c24a2b3ff361d5cde # v4.0.3
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Audit production dependency graph
        run: npm audit --omit=dev --audit-level=high
      - name: Contract tests, lint, and production build
        run: npm run check
      - name: Generate frontend CycloneDX SBOM
        run: npm sbom --package-lock-only --sbom-format cyclonedx --sbom-type application > fraudshield-frontend.cdx.json
      - name: Upload production bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fraudshield-frontend-${{ github.sha }}
          path: frontend/dist
          if-no-files-found: error
          retention-days: 30
      - name: Upload frontend dependency evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fraudshield-frontend-sbom-${{ github.sha }}
          path: frontend/fraudshield-frontend.cdx.json
          if-no-files-found: error
          retention-days: 30

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build hardened frontend container
        run: >-
          docker build --pull
          --build-arg VITE_DEMO_ENABLED=false
          --tag fraudshield-frontend:${{ github.sha }}
          frontend
