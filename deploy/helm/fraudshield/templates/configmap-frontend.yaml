{{- if .Values.frontend.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fraudshield.fullname" . }}-frontend
  labels:
    {{- include "fraudshield.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;
      root /usr/share/nginx/html;
      index index.html;
      server_tokens off;
      client_max_body_size 80m;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
      add_header Referrer-Policy "no-referrer" always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
      add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'" always;
      location /api/ {
        proxy_pass http://{{ include "fraudshield.fullname" . }}:{{ .Values.service.port }};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $http_x_request_id;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 600s;
        proxy_request_buffering off;
      }
      location = /health {
        proxy_pass http://{{ include "fraudshield.fullname" . }}:{{ .Values.service.port }};
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $http_x_request_id;
      }
      location = /health/ready { return 404; }
      location = /metrics { return 404; }
      location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
      }
      location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
      }
    }
{{- end }}
