apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fraudshield.fullname" . }}-worker
  labels:
    {{- include "fraudshield.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "fraudshield.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "fraudshield.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.worker.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- if .Values.worker.runtimeClassName }}
      runtimeClassName: {{ .Values.worker.runtimeClassName }}
      {{- end }}
      serviceAccountName: {{ include "fraudshield.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: worker
          image: {{ include "fraudshield.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["fraudshield"]
          args: ["worker"]
          envFrom:
            - configMapRef:
                name: {{ include "fraudshield.fullname" . }}
            - secretRef:
                name: {{ .Values.existingSecret }}
          {{- if .Values.trustedCa.configMapName }}
          env:
            - name: SSL_CERT_FILE
              value: /etc/fraudshield/ca/ca-bundle.crt
            - name: AWS_CA_BUNDLE
              value: /etc/fraudshield/ca/ca-bundle.crt
          {{- end }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: runtime
              mountPath: /var/lib/fraudshield
            - name: tmp
              mountPath: /tmp
            {{- if .Values.trustedCa.configMapName }}
            - name: trusted-ca
              mountPath: /etc/fraudshield/ca
              readOnly: true
            {{- end }}
      volumes:
        - name: runtime
          emptyDir:
            sizeLimit: {{ .Values.runtimeStorage.sizeLimit }}
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.tmpStorage.sizeLimit }}
        {{- if .Values.trustedCa.configMapName }}
        - name: trusted-ca
          configMap:
            name: {{ .Values.trustedCa.configMapName }}
            items:
              - key: {{ .Values.trustedCa.key }}
                path: ca-bundle.crt
        {{- end }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "fraudshield.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: worker
      {{- with .Values.worker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
