# Example shape only. Do not commit a populated Secret. Prefer External Secrets,
# Vault, or the bank's native secrets manager and workload identity.
apiVersion: v1
kind: Secret
metadata:
  name: fraudshield-runtime-secrets
  namespace: fraudshield
type: Opaque
stringData:
  FRAUDSHIELD_DATABASE_URL: postgresql://fraudshield:REPLACE@postgres.bank.example/fraudshield?sslmode=verify-full&sslrootcert=/etc/fraudshield/ca/ca-bundle.crt
  FRAUDSHIELD_AUDIT_HMAC_KEY: REPLACE_WITH_AT_LEAST_32_RANDOM_CHARACTERS
