[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fraudshield-backend"
version = "3.0.0"
description = "Evidence-grounded multi-engine Android APK intelligence backend"
readme = "README.md"
license = { text = "AGPL-3.0-only" }
requires-python = ">=3.11,<3.14"
dependencies = [
  "androguard>=4.1.4,<5",
  "fastapi>=0.141.1,<1",
  "httpx>=0.28.1,<1",
  "pydantic>=2.13.4,<3",
  "python-dotenv>=1.2.2,<2",
  "python-multipart>=0.0.32,<1",
  "reportlab>=5.0.0,<6",
  "uvicorn>=0.52.1,<1"
]

[project.optional-dependencies]
openai = ["openai>=2,<4"]
analysis = [
  "apkid>=3.1,<4",
  "dexofuzzy>=2,<3",
  "quark-engine>=26.6,<27",
  "six>=1.16,<2",
  "yara-python-dex>=1.0.7,<2"
]
production = [
  "boto3>=1.40,<2",
  "prometheus-client>=0.26,<1",
  "psycopg[binary]>=3.3.4,<4",
  "psycopg-pool>=3.3,<4",
  "PyJWT[crypto]>=2.13,<3"
]
dev = [
  "PyJWT[crypto]>=2.13,<3",
  "pytest>=9.1.1,<10",
  "pytest-cov>=7,<8",
  "ruff>=0.14,<1"
]

[project.scripts]
fraudshield = "fraudshield.cli:main"

[tool.setuptools.packages.find]
include = ["fraudshield*"]

[tool.setuptools.package-data]
fraudshield = ["resources/*.json", "resources/yara/*.yar"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]
